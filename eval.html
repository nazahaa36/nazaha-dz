<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>منصة التقييم اليومي</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{--bg:#f5f6fc;--sf:#fff;--tx:#000c41;--mu:#667;--pr:#0023bb;--ac:#fb7100;--bd:#c7cff0;--hd:#edf0fa;--ok:#117a3d;--er:#c0262d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;font-size:15px}
header.top{background:var(--pr);color:#fff;padding:12px 16px;font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--ac)}
header.top small{font-weight:400;opacity:.85}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--sf);border-bottom:1px solid var(--bd);padding:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{white-space:nowrap;border:0;background:transparent;font-weight:500}nav button.on{background:var(--pr);color:#fff}
main{padding:12px;max-width:1300px;margin:auto}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.o{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.st{border-top:4px solid var(--ac)}.st b{display:block;font-size:28px;color:var(--pr)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:8px}label.l{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mu)}
.w{overflow-x:auto}table.t{border-collapse:collapse;width:100%}table.t th,table.t td{border:1px solid var(--bd);padding:6px;text-align:center;font-size:13px}table.t th{background:var(--hd)}
.err{color:var(--er)}.ok{color:var(--ok)}
.paper{background:#fff;color:#000c41;direction:rtl;padding:10px;min-width:1050px;font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif}
.lh{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #fb7100;padding-bottom:6px;margin-bottom:6px}.lh img{height:58px}
.ttl{text-align:center;color:#0023bb;font-weight:700;font-size:19px;margin:4px 0 8px}
.bxs{display:flex;gap:10px;margin-bottom:8px}.bx{border:1px solid #8c9ce0;border-radius:10px;padding:6px 10px;flex:1}.bx h4{margin:0 0 4px;color:#0023bb;font-size:12px;border-bottom:1px solid #d6dcf4;padding-bottom:3px}
.fl{display:flex;gap:10px}.fl div{flex:1;font-size:10px;color:#667}.fl input,.fl b{display:block;width:100%;border:0;border-bottom:1px solid #000c41;background:transparent;color:#000;font-size:12px;min-height:22px;padding:2px;border-radius:0;font-weight:500}
table.cd{border-collapse:collapse;width:100%}.cd th,.cd td{border:1px solid #5970d3;text-align:center;color:#000}
.cd th.hd{background:#0023bb;color:#fff;font-size:11px;padding:4px}.cd th.cr{background:#edf0fa;color:#0023bb;font-size:8.5px;padding:3px 2px;min-width:42px;max-width:56px;line-height:1.3}
.cd td.wt{background:#edf0fa;color:#fb7100;font-weight:700;font-size:12px}.cd td.rn{background:#e0e5f7;color:#0023bb;font-weight:700;width:26px}.cd td.tt{background:#fff1e6;font-weight:700;width:46px}
.cd td.rl{background:#fff;color:#0023bb;font-weight:700;font-size:11px;text-align:right;padding:0 6px;min-width:130px}
.cd td{height:25px;font-size:12px}.cd input.sc{width:100%;min-width:30px;border:0;text-align:center;background:transparent;padding:2px;color:#000;border-radius:0}.cd input.sc.bad{background:#ffd9db}
.cd select,.cd td input.nt{border:0;width:100%;background:transparent;color:#000;font-size:12px;padding:2px;border-radius:0}
.nt2{font-size:10px;margin:4px 0}.sg{display:flex;gap:10px;margin-top:4px}.sg .bx{height:86px;border-color:#0023bb}.sg .bx h4{border:0}.sg small{color:#667;font-size:10px;display:block}
.ft{text-align:center;font-size:10px;color:#667;border-top:1px solid #0023bb;width:40%;margin:10px auto 0;padding-top:3px}
#pv{display:none;position:fixed;inset:0;background:rgba(10,15,40,.7);z-index:20;overflow:auto;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
#pv .bar{display:flex;gap:8px;margin-bottom:8px;position:sticky;right:0}#pvb{overflow-x:auto}
@media print{@page{size:A4 landscape;margin:7mm}body>*:not(#pv){display:none!important}#pv{display:block!important;position:static;background:#fff;padding:0;overflow:visible}#pv .bar{display:none}.paper{min-width:0;width:100%;padding:0}}
.card{border-color:#8c9ce0}.ct{color:var(--pr);font-weight:700;font-size:15px;border-bottom:1px solid var(--bd);padding-bottom:5px;margin:0 0 10px}
table.t th{background:var(--pr);color:#fff;border-color:#334fc9}table.t tr:nth-child(even) td{background:var(--hd)}
.st{background:var(--hd)}.st b{color:var(--ac)}nav button.on{box-shadow:inset 0 -3px 0 var(--ac)}
header.top{font-size:18px}.mf{text-align:center;font-size:12px;color:var(--mu);border-top:1px solid var(--pr);width:min(420px,70%);margin:16px auto 24px;padding-top:4px}
</style></head><body>

<label class="l">الصفة الإدارية<select id="pk" onchange="pkc()"><option value="v">متطوع</option><option value="h">رئيس خلية/مصلحة</option><option value="a">سفير ولائي</option></select></label>
<label class="l" id="pxl"></label><label class="l" id="psl"></label><button class="p" onclick="addP()">إضافة</button></div><div class="err" id="pe"></div></div>
<div class="card w"><h3 class="ct">قائمة الأشخاص</h3><table class="t"><tr><th>الاسم</th><th>الرقم</th><th>الصفة</th><th>الخلية / المنصب / الولاية</th><th></th></tr>${[...S.people].sort((a,b)=>a.name>b.name?1:-1).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.no)}</td><td>${KN[p.kind]}</td><td>${esc(p.kind=="h"?ROLES[p.ri]+(p.unit?" — "+p.unit:""):p.unit)}</td><td><button onclick="delP('${p.id}')">حذف</button></td></tr>`).join("")}</table></div>`}
function pkc(){const e=$("#pk");if(!e)return;const k=e.value;$("#pxl").innerHTML=k=="h"?`المنصب<select id="px">${ROLES.map((r,i)=>`<option value="${i}">${r}</option>`).join("")}</select>`:`${k=="a"?"الولاية":"الخلية"}<input id="px">`;$("#psl").innerHTML=(k=="h"?"الخلية التي يرأسها (اختياري)":"القسم")+'<input id="ps">';$("#psl").style.display=k=="a"?"none":""}
async function addP(){const n=$("#pn").value.trim(),k=$("#pk").value,x=$("#px").value.trim();
 if(!n||!x){$("#pe").textContent="الاسم والخلية/المنصب/الولاية إلزامية";return}
 await S.db.collection("people").doc("p"+Date.now()).set({name:n,no:$("#pa").value.trim(),kind:k,unit:k=="h"?$("#ps").value.trim():x,ri:k=="h"?+x:null,sec:k=="v"?$("#ps").value.trim():""});log("إضافة شخص",n)}
async function delP(id){if(!S.admin)return alert("للمدير فقط");const p=S.people.find(x=>x.id==id);await S.db.collection("people").doc(id).delete();log("حذف شخص",p&&p.name)}
const key=(k,d,sc)=>[k,d,sc].join("_").replace(/[\s\/\\'"]+/g,"-");
const blank=ri=>({pid:"",name:"",s:[],n:"",ri});
function hydrate(sh){const n=CARDS[sh.kind].rows;if(sh.kind=="h"){const m={};sh.rows.forEach(r=>m[r.ri]=r);sh.rows=ROLES.map((_,i)=>m[i]||blank(i))}else while(sh.rows.length<n)sh.rows.push(blank());return sh}
/* الجدول الموحد: نفسه للإدخال والمعاينة والطباعة */
function boxes(sh,ed){const k=sh.kind,d=(sh.date||"").split("-");
 const f=(l,h)=>`<div>${l}${ed&&h?`<input data-h="${h}" value="${esc(sh.head[h])}">`:`<b>${h?esc(sh.head[h]):""}</b>`}</div>`;
 const dt=`<div class="bx"><h4>التاريخ</h4><div class="fl"><div>اليوم<b>${d[2]||""}</b></div><div>الشهر<b>${d[1]||""}</b></div><div>السنة<b>${d[0]||""}</b></div></div></div>`;
 if(k=="v")return `<div class="bxs"><div class="bx"><h4>الخلية</h4><div class="fl">${f("اسم الخلية","cell")}${f("القسم","sec")}</div></div><div class="bx"><h4>اسم المسؤول</h4><div class="fl">${f("الاسم الكامل","mgr")}${f("الصفة","mrole")}</div></div>${dt}</div>`;
 if(k=="h")return `<div class="bxs"><div class="bx"><h4>المقيّم</h4><div class="fl"><div>الصفة<b>رئيس المنتدى</b></div>${f("الاسم الكامل","ev")}</div></div>${dt}</div>`;
 return `<div class="bxs"><div class="bx"><h4>الولاية</h4><div class="fl">${f("الاسم","wil")}</div></div><div class="bx"><h4>السفير الولائي</h4><div class="fl">${f("الاسم الكامل","amb")}</div></div>${dt}</div>`}
function paper(sh,ed,doc){const k=sh.kind,c=CARDS[k],lead=k=="h"?2:1;
 const cand=i=>S.people.filter(p=>p.kind==k&&(k=="h"?p.ri==i:p.unit==sh.scope)),lock=sh.status=="approved";
 return `<div class="paper">${doc?`<div class="lh"><img src="${IMG.min}"><img src="${IMG.logo}"></div>`:""}
 <div class="ttl">${c.n}</div>${boxes(sh,ed)}
 <table class="cd"><tr><th class="hd" rowspan="3">${k=="h"?"#":"م"}</th>${k=="h"?'<th class="hd" rowspan="3">الصفة الإدارية</th>':""}<th class="hd" rowspan="3" style="min-width:150px">${k=="a"?"الاسم الكامل":"الاسم الكامل"}</th>${c.G.map(g=>`<th class="hd" colspan="${g[1].length}">${g[0]} (${g[1].reduce((a,x)=>a+x[1],0)})</th>`).join("")}<th class="hd" rowspan="3">المجموع<br>من 20</th><th class="hd" rowspan="3">${c.avg}</th><th class="hd" rowspan="3" style="min-width:80px">ملاحظات</th></tr>
 <tr>${c.C.map(x=>`<th class="cr">${x[0]}</th>`).join("")}</tr><tr>${c.M.map(m=>`<td class="wt">${m}</td>`).join("")}</tr>
 ${sh.rows.map((r,i)=>`<tr><td class="rn">${i+1}</td>${k=="h"?`<td class="rl">${ROLES[i]}</td>`:""}<td>${ed&&!lock?`<select data-n="${i}"><option value=""></option>${cand(i).map(p=>`<option value="${p.id}" ${r.pid==p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select>`:esc(r.name)}</td>${c.M.map((m,j)=>`<td>${ed&&!lock?`<input class="sc" type="number" inputmode="numeric" min="0" max="${m}" step="1" data-r="${i}" data-c="${j}" value="${r.s[j]??""}">`:(r.s[j]??"")}</td>`).join("")}<td class="tt" id="t${i}">${has(r)&&!ed?sum(r):""}</td><td class="tt" id="p${i}">${has(r)&&!ed?pct(r)+"%":""}</td><td>${ed&&!lock?`<input class="nt" data-o="${i}" value="${esc(r.n)}">`:esc(r.n)}</td></tr>`).join("")}</table>
 ${c.note?`<div class="nt2"><b>تعليمة عامة:</b> ${c.note}</div>`:""}<h4 style="margin:6px 0 2px;color:#0023bb">التوقيعات</h4>
 <div class="sg">${c.sign.map((s,i)=>{const n=[k=="v"?sh.head.mgr:cfg().pres,cfg().hr][i];return `<div class="bx"><h4>${s[0]}</h4>${s[1]?`<small>${s[1]}</small>`:""}${n?`<small style="color:#000;font-size:11px">الاسم: ${esc(n)}</small>`:""}<small>التوقيع</small></div>`}).join("")}</div><div class="ft">${FOOT}</div></div>`}
function ent(){const sh=S.sh;
 if(!sh)return `<div class="card"><h3 class="ct">إدخال تقييم يومي</h3><div class="row"><label class="l">التاريخ<input type="date" id="ed" value="${today()}"></label>
 <label class="l">البطاقة<select id="ek" onchange="scopeOpts()"><option value="v">${CARDS.v.n}</option><option value="h">${CARDS.h.n}</option><option value="a">${CARDS.a.n}</option></select></label>
 <label class="l" id="esl"></label><button class="p" onclick="openSh()">فتح البطاقة</button></div><small>تُختار البطاقة حسب الصفة الإدارية: المتطوعون ← بطاقة الخلية، رؤساء الخلايا والمصالح ← بطاقتهم، السفراء ← بطاقة الولاية.</small></div>`+(setTimeout(scopeOpts,0),"");
 const lock=sh.status=="approved";
 return `<div class="card"><div class="row"><b>${CARDS[sh.kind].n}</b><span class="${lock?"ok":""}">${ST[sh.status]}</span></div>
 <div class="w">${paper(sh,true,false)}</div><div class="err" id="ee">${S.errs.map(esc).join("<br>")}</div>
 <div class="row" style="margin-top:10px">${lock?"":`${sh.kind!="h"?'<button onclick="addRow()">+ سطر</button>':""}<button onclick="save(\'draft\')">حفظ مسودة</button><button class="p" onclick="save(\'submitted\')">اعتماد التسجيل</button>`}
 ${S.admin&&sh.status=="submitted"?`<button class="o" onclick="save('approved')">مصادقة المراجع</button><button onclick="save('draft','إرجاع للتصحيح')">إعادة للتصحيح</button>`:""}
 ${S.admin&&!lock?`<label class="l" style="flex-direction:row;align-items:center"><input type="checkbox" id="dup" ${sh.dup?"checked":""}> تصريح بتقييم مكرر</label>`:""}
 ${lock&&S.admin?`<button onclick="save('draft','فتح للتعديل')">فتح للتعديل</button>`:""}
 <button onclick="prev(S.sh)">معاينة / PDF</button><button onclick="S.sh=null;render()">إغلاق</button></div></div>`}
function scopeOpts(){const e=$("#ek");if(!e)return;const v=e.value,u=[...new Set(S.people.filter(p=>p.kind==v).map(p=>p.unit))].filter(Boolean);
 $("#esl").style.display=v=="h"?"none":"";$("#esl").innerHTML=(v=="a"?"الولاية":"الخلية")+`<select id="es">${u.map(x=>`<option>${esc(x)}</option>`).join("")||"<option value=''>(أضف أشخاصاً أولاً)</option>"}</select>`}
function openSh(){const k=$("#ek").value,d=$("#ed").value,sc=k=="h"?"all":$("#es").value;if(!d||(k!="h"&&!sc))return alert("حدد التاريخ والخلية/الولاية");
 const id=key(k,d,sc),ex=S.evals.find(e=>e.id==id);
 S.sh=fill(hydrate(ex?JSON.parse(JSON.stringify(ex)):{id,kind:k,date:d,scope:sc,head:{},status:"draft",rows:[],fresh:1}));S.errs=[];render()}
function addRow(){S.sh.rows.push(blank());render()}
function calc(){S.sh.rows.forEach((r,i)=>{const e=$("#t"+i);if(!e)return;e.textContent=has(r)&&r.s.some(x=>x!==""&&x!=null)?sum(r):"";$("#p"+i).textContent=e.textContent?pct(r)+"%":""})}
$("#m").addEventListener("input",e=>{const t=e.target,sh=S.sh;if(!sh)return;
 if(t.dataset.r!=null){const r=sh.rows[t.dataset.r],j=+t.dataset.c,m=CARDS[sh.kind].M[j];let v=t.value;if(v!==""){v=Math.round(+v);if(v<0)v=0;if(v>m)v=m;t.value=v}r.s[j]=v===""?"":v;calc()}
 else if(t.dataset.o!=null)sh.rows[t.dataset.o].n=t.value;else if(t.dataset.h)sh.head[t.dataset.h]=t.value;else if(t.id=="dup")sh.dup=t.checked});
$("#m").addEventListener("change",e=>{const t=e.target,sh=S.sh;if(sh&&t.dataset.n!=null){const r=sh.rows[t.dataset.n],p=S.people.find(x=>x.id==t.value);r.pid=t.value;r.name=p?p.name:""}});
function validate(sh,strict){const c=CARDS[sh.kind],er=[],seen={},H=sh.head;
 if(sh.kind=="v"&&!(H.cell||"").trim())er.push("اسم الخلية إلزامي");if(sh.kind=="v"&&!(H.mgr||"").trim())er.push("اسم المسؤول إلزامي");if(sh.kind=="a"&&!(H.wil||"").trim())er.push("الولاية إلزامية");
 const rows=sh.rows.filter(has);if(!rows.length)er.push("لا توجد أسطر مقيَّمة");
 rows.forEach((r,i)=>{if(!r.pid)er.push(`السطر ${i+1}: اختر الشخص`);else{if(seen[r.pid])er.push(`${r.name}: مكرر في البطاقة`);seen[r.pid]=1;
  const p=S.people.find(x=>x.id==r.pid);if(p&&p.kind!=sh.kind)er.push(`${r.name}: بطاقة غير متوافقة مع صفته`);
  if(!sh.dup&&S.evals.some(e=>e.id!=sh.id&&e.date==sh.date&&e.kind==sh.kind&&e.rows.some(x=>x.pid==r.pid)))er.push(`${r.name}: لديه تقييم آخر في اليوم نفسه`)}
  c.M.forEach((m,j)=>{const v=r.s[j];if(v===""||v==null){if(strict)er.push(`${r.name||"سطر "+(i+1)}: خانة فارغة (${c.C[j][0]})`)}else if(!Number.isInteger(+v)||v<0||v>m)er.push(`${r.name}: قيمة غير صحيحة في (${c.C[j][0]})`)})});
 return er}
async function save(st,note){const sh=S.sh,out={...sh,rows:sh.rows.filter(has)},er=validate(out,st!="draft");
 if(er.length){S.errs=er;$("#ee").innerHTML=er.map(esc).join("<br>");return}
 const old=S.evals.find(e=>e.id==sh.id);Object.assign(out,{status:st,by:old?old.by:S.uid,mod:S.uid,t:new Date().toISOString(),dup:!!sh.dup});
 out.rows.forEach(r=>{r.tot=sum(r);r.pct=pct(r)});
 try{await S.db.collection("evals").doc(sh.id).set(out);log(note||{draft:old?"تعديل":"إنشاء",submitted:"اعتماد التسجيل",approved:"مصادقة"}[st],out.date+" · "+CARDS[out.kind].n+" · "+out.scope);S.sh=hydrate(JSON.parse(JSON.stringify(out)));S.errs=[];render();alert("تم الحفظ")}catch(e){alert("فشل الحفظ: "+(e.message||e.code))}}
const byName=(a,b)=>a.name>b.name?1:-1,cfg=()=>S.settings.find(x=>x.id=="forum")||{};
function fill(sh){const k=sh.kind,H=sh.head,P=S.people,cf=cfg(),set=(a,v)=>{if(!H[a]&&v)H[a]=v},put=L=>{while(sh.rows.length<L.length)sh.rows.push(blank());L.forEach((p,i)=>{sh.rows[i].pid=p.id;sh.rows[i].name=p.name})};
 if(k=="v"){const L=P.filter(p=>p.kind=="v"&&p.unit==sh.scope).sort(byName),m=P.find(p=>p.kind=="h"&&p.unit==sh.scope);set("cell",sh.scope);set("sec",(L.find(p=>p.sec)||{}).sec);if(m){set("mgr",m.name);set("mrole",ROLES[m.ri])}if(sh.fresh)put(L)}
 if(k=="h"){set("ev",cf.pres);if(sh.fresh)sh.rows.forEach((r,i)=>{const c=P.filter(p=>p.kind=="h"&&p.ri==i);if(c.length==1){r.pid=c[0].id;r.name=c[0].name}})}
 if(k=="a"){const L=P.filter(p=>p.kind=="a"&&p.unit==sh.scope).sort(byName);set("wil",sh.scope);set("amb",(L[0]||{}).name);if(sh.fresh)put(L)}
 delete sh.fresh;return sh}
function setv(){const c=cfg();return `<div class="card"><h3 class="ct">إعدادات الوثائق</h3><div class="row"><label class="l">اسم رئيس المنتدى<input id="sp" value="${esc(c.pres)}"></label><label class="l">اسم مسؤول التقييم والأداء<input id="sq" value="${esc(c.hr)}"></label><button class="p" onclick="saveSet()">حفظ</button></div><small>تظهر هذه الأسماء تلقائياً في حقل «المقيّم» وفي خانات التوقيعات.</small></div><div class="card"><h3 class="ct">النسخ الاحتياطي والاستعادة</h3><div class="row"><button class="p" onclick="backup()">تصدير نسخة احتياطية</button><label class="l">استعادة من ملف<input type="file" accept=".json" onchange="restore(this.files[0])"></label></div><small>البيانات محفوظة في هذا المتصفح على هذا الجهاز. صدّر نسخة احتياطية بانتظام.</small></div><div class="card"><h3 class="ct">التعبئة التلقائية</h3><small>الخلية والقسم من بيانات المتطوعين · اسم المسؤول وصفته من رئيس الخلية المسجل · الولاية والسفير من بيانات السفراء · التاريخ من اليوم المختار · أسماء الأسطر من الأشخاص المسجلين.</small></div>`}
async function saveSet(){if(!S.admin)return alert("للمدير فقط");await S.db.collection("settings").doc("forum").set({pres:$("#sp").value.trim(),hr:$("#sq").value.trim()});log("تحديث الإعدادات","");alert("تم الحفظ")}
function rec(){const l=[...S.evals].sort((a,b)=>b.date>a.date?1:-1);
 return `<div class="card w"><h3 class="ct">سجل البطاقات</h3><table class="t"><tr><th>التاريخ</th><th>البطاقة</th><th>الخلية/الولاية</th><th>الأسطر</th><th>الحالة</th><th></th></tr>${l.map(e=>`<tr><td>${e.date}</td><td>${CARDS[e.kind].n}</td><td>${e.scope=="all"?"—":esc(e.scope)}</td><td>${e.rows.length}</td><td>${ST[e.status]}</td><td><button onclick="opn('${e.id}')">فتح</button> <button onclick="prev(hydrate(JSON.parse(JSON.stringify(S.evals.find(x=>x.id=='${e.id}')))))">PDF</button></td></tr>`).join("")||"<tr><td>لا سجلات</td></tr>"}</table></div>`}
function opn(id){S.sh=hydrate(JSON.parse(JSON.stringify(S.evals.find(e=>e.id==id))));S.errs=[];S.tab="ent";render()}
const LH=`<div class="lh"><img src="${IMG.min}"><img src="${IMG.logo}"></div>`;
function prev(sh){$("#pv").innerHTML=`<div class="bar"><button class="p" onclick="try{window.print()}catch(e){alert('استخدم طباعة المتصفح')}">طباعة / حفظ PDF</button><button onclick="$('#pv').style.display='none'">إغلاق</button></div><div id="pvb">${paper(sh,false,true)}</div>`;$("#pv").style.display="block"}
function csv(name,rows){dl(name,"\ufeff"+rows.map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv")}
const inR=(e,f,t)=>(!f||e.date>=f)&&(!t||e.date<=t);
function docView(html){$("#pv").innerHTML=`<div class="bar"><button class="p" onclick="try{window.print()}catch(e){alert('استخدم طباعة المتصفح')}">طباعة / حفظ PDF</button><button onclick="$('#pv').style.display='none'">إغلاق</button></div><div class="paper">${LH}${html}<div class="ft">${FOOT}</div></div>`;$("#pv").style.display="block"}
function ind(){return `<div class="card"><h3 class="ct">كشف فردي تفصيلي</h3><div class="row"><label class="l">الشخص<select id="ip">${S.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></label><label class="l">من<input type="date" id="if"></label><label class="l">إلى<input type="date" id="it"></label><button class="p" onclick="runInd()">إعداد الكشف</button></div><div id="ir"></div></div>`}
function runInd(){const p=S.people.find(x=>x.id==$("#ip").value);if(!p)return;const f=$("#if").value,t=$("#it").value;
 const L=S.evals.filter(e=>e.kind==p.kind&&e.status=="approved"&&inR(e,f,t)).sort((a,b)=>a.date>b.date?1:-1).map(e=>({e,r:e.rows.find(r=>r.pid==p.id)})).filter(x=>x.r);
 const c=CARDS[p.kind],avg=L.length?Math.round(L.reduce((a,x)=>a+sum(x.r),0)/L.length*100)/100:0;
 window.IND=[["الاسم",p.name,"الرقم",p.no],["التاريخ",...c.C.map(x=>x[0]),"المجموع","النسبة %","ملاحظات"],...L.map(x=>[x.e.date,...c.M.map((m,j)=>x.r.s[j]),sum(x.r),pct(x.r),x.r.n])];
 const sm=`<p><b>${esc(p.name)}</b> — ${KN[p.kind]} — الرقم الإداري: ${esc(p.no)} — عدد أيام التقييم: <b>${L.length}</b> — المعدل العام: <b>${avg}/20</b> (${Math.round(avg*50)/10}%)</p>`;
 const tb=`<table class="cd"><tr><th class="hd">التاريخ</th><th class="hd">المجموع</th><th class="hd">%</th><th class="hd">تفاصيل المعايير</th><th class="hd">ملاحظات</th></tr>${L.map(x=>`<tr><td>${x.e.date}</td><td class="tt">${sum(x.r)}</td><td class="tt">${pct(x.r)}%</td><td style="text-align:right;font-size:10px">${c.C.map((q,j)=>q[0]+": "+(x.r.s[j]??"")).join(" · ")}</td><td>${esc(x.r.n)}</td></tr>`).join("")||'<tr><td colspan="5">لا تقييمات معتمدة في الفترة</td></tr>'}</table>`;
 window.IV=`<div class="ttl">كشف تقييمات فردي</div>${sm}${tb}`;
 $("#ir").innerHTML=`<div class="w"><div class="paper" style="min-width:0">${sm}${tb}</div></div><div class="row" style="margin-top:8px"><button onclick="csv('kashf-fardi-'+Date.now()+'.csv',IND)">تصدير Excel</button><button class="p" onclick="docView(IV)">معاينة / PDF</button></div>`}
function grp(){return `<div class="card"><h3 class="ct">كشف جماعي</h3><div class="row"><label class="l">البطاقة<select id="gk"><option value="">الكل</option><option value="v">متطوعون</option><option value="h">رؤساء</option><option value="a">سفراء</option></select></label><label class="l">الخلية/الولاية<input id="gs"></label><label class="l">من<input type="date" id="gf"></label><label class="l">إلى<input type="date" id="gt"></label><button class="p" onclick="runGrp()">إعداد الكشف</button></div><div id="gr"></div></div>`}
function runGrp(){const k=$("#gk").value,s=$("#gs").value.trim(),f=$("#gf").value,t=$("#gt").value,M={};
 S.evals.filter(e=>e.status=="approved"&&(!k||e.kind==k)&&(!s||e.scope==s)&&inR(e,f,t)).forEach(e=>e.rows.forEach(r=>{(M[r.pid]=M[r.pid]||{n:r.name,k:e.kind,u:e.scope,l:[]}).l.push(r)}));
 const R=Object.values(M).map(x=>({...x,c:x.l.length,a:Math.round(x.l.reduce((a,r)=>a+sum(r),0)/x.l.length*100)/100}));
